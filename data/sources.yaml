# Corpus manifest. Every indexed document is listed here with its provenance.
# A "document" can be a page range of a PDF: the official IORT volume bundles
# the Personal Status Code with the related laws and decrees in an annex.
#
# legal_status:
#   consolidated  - current consolidated text (as revised by the publisher)
#   historical    - outdated consolidation, kept only to answer "what did the
#                   text say before?" questions; excluded from default search
# authority:
#   official      - published by the Imprimerie Officielle (IORT) / Ministry of Justice
#   secondary     - reproduction by a third party
# multi_act: the page range bundles several acts whose article numbering
#   restarts at 1 (a law and its implementing orders).

