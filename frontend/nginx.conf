server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API: /api/* -> backend (no CORS needed in production).
  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;   # CPU generation can take a while
  }

  location / {
    try_files $uri /index.html;
  }
}
