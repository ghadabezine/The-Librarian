services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      RAG_CORS_ORIGINS: '["http://localhost:8080"]'
    volumes:
      - ./models:/app/models          # model weights (fetched on first start)
      - ./data/index:/app/data/index  # persistent index (built on first start)
      - ./data/feedback:/app/data/feedback
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped
